name: Daily gamma update
on:
  schedule:
    - cron: '35 13 * * 1-5'
    - cron: '35 14 * * 1-5'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'close = end of day, morning = morning snapshot'
        default: 'close'
        type: choice
        options: [close, morning]
      date:
        description: 'optional test date YYYY-MM-DD (leave empty for today)'
        default: ''
permissions:
  contents: write
concurrency:
  group: gamma-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || ((github.event.schedule == '35 13 * * 1-5' || github.event.schedule == '35 14 * * 1-5') && 'morning' || 'close') }}
      FORCE: ${{ github.event.inputs.mode && '1' || '' }}
      TARGET_DATE: ${{ github.event.inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - id: fetch
        run: python scripts/fetch_gamma.py
        continue-on-error: true
      - name: Save data
        run: |
          git config user.name "gamma-bot"
          git config user.email "gamma-bot@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || git commit -m "Gamma update ($MODE)"
          git pull --rebase
          git push
      - name: Fail if something could not be read
        if: steps.fetch.outcome == 'failure'
        run: exit 1
