name: Daily gamma update
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - id: fetch
        run: python scripts/fetch_gamma.py
        continue-on-error: true
      - name: Save data
        run: |
          git config user.name "gamma-bot"
          git config user.email "gamma-bot@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || git commit -m "Daily gamma update"
          git push
      - name: Fail if something could not be read
        if: steps.fetch.outcome == 'failure'
        run: exit 1
